<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Raid Tracker — Cobblemon</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@400;500;700&display=swap');
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;

  .wrap { flex: 1; min-width: 0; }

    border-radius: 8px; padding: 12px; position: sticky; top: 16px;

  .presence-item { display: flex; align-items: center; gap: 7px; font-size: 12.5px; padding: 5px 0; }

  .presence-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .presence-empty { font-size: 11.5px; color: #5c606a; font-style: italic; }

  .notif-btn, .status-banner {

  .sound-panel {

  .zone-label:focus { outline: none; border-bottom: 1px solid #E6473F; }

  .slot-empty { background: #1a1d23; border: 1px dashed #2C303A; border-radius: 8px; min-height: 64px; display: flex; align-items: center; justify-content: center; }
  .slot-empty.open { align-items: flex-start; }

<!-- Firebase (compat build, no bundler needed) -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script>
// ==========================================================================
// 1) COLLE ICI la config de TON projet Firebase (Console Firebase > ⚙️
//    Paramètres du projet > tes applications > SDK setup and configuration)
// ==========================================================================
const firebaseConfig = {
  apiKey: "AIzaSyBzL5qt0RduWbyluSE-luWMygTHHbeHA38",
  authDomain: "raid-tracker-4f7dc.firebaseapp.com",
  databaseURL: "https://raid-tracker-4f7dc-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "raid-tracker-4f7dc",
  storageBucket: "raid-tracker-4f7dc.firebasestorage.app",
  messagingSenderId: "663219222496",
  appId: "1:663219222496:web:8b0ce0976de396c6a25d85"
};
// ==========================================================================

// Configuration des zones : nom de zone + liste des lieux (chacun = un
// emplacement de raid dédié). À compléter quand les 3 zones restantes
// sortiront dans le jeu.
const ZONES_CONFIG = [
  { label: "Zone 1", locations: ["Tente", "Arbre", "Grotte", "Lac"] },
  { label: "Zone 2", locations: ["Marais", "Lac", "Grotte", "Arène"] },
  { label: "Zone 3", locations: ["Plaine", "Chemin", "Phare", "Chalet"] },
  { label: "Zone 4", locations: ["Manoir", "Éolienne", "Tour", "Grotte"] },
];
const ZONE_COUNT = ZONES_CONFIG.length;
let zones = null; // loaded from Firebase
let notifiedIds = new Set();
let repeatTimer = null;
let openForm = null;
let pseudo = "";
// Mode admin : simple protection locale par mot de passe, dans le même
// esprit que la restriction d'édition (une politesse d'interface, pas une
// vraie sécurité serveur — voir la discussion précédente). Change le mot
// de passe ci-dessous avant de mettre en ligne.
const ADMIN_PASSWORD = "Kamouiller25072000";
const ADMIN_STORAGE_KEY = "cobblemon-raid-admin";
let adminMode = localStorage.getItem(ADMIN_STORAGE_KEY) === "1";
function isAdmin() {
  return adminMode;
}
let db = null;
let zonesRef = null;
let presenceRef = null;
let historyRef = null;
let firebaseReady = false;
const sessionId = "s-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8);

// ---------- Gate (pseudo entry) is wired up FIRST, before anything that
// could throw, so the button always works even if Firebase config below
// is wrong or the network is unavailable. ----------
document.getElementById("enterBtn").addEventListener("click", enterApp);
document.getElementById("pseudoInput").addEventListener("keydown", (e) => { if (e.key === "Enter") enterApp(); });

function showGateError(msg) {
  let el = document.getElementById("gateError");
  if (!el) {
    el = document.createElement("p");
    el.id = "gateError";
    el.style.color = "#E6473F";
    el.style.fontSize = "11.5px";
    el.style.marginTop = "10px";
    document.querySelector(".gate-box").appendChild(el);
  }
  el.textContent = msg;
}

function enterApp() {
  pseudo = document.getElementById("pseudoInput").value.trim();
  if (!firebaseReady) {
    showGateError("⚠️ Connexion à Firebase impossible — vérifie la config firebaseConfig tout en haut du <script> dans index.html (regarde la console du navigateur, touche F12, pour le détail de l'erreur).");
    return;
  }
  document.getElementById("gate").style.display = "none";
  document.getElementById("app").style.display = "flex";
  document.getElementById("whoami").textContent = `Connecté en tant que ${pseudo || "anonyme"} · sync en direct`;
  initSoundPanel();
  initCopySummary();
  initHistoryPanel();
  initAdminMode();
  setupPresence();
  updateNotifBtn();
  if (typeof Notification !== "undefined" && Notification.permission === "default") {
    Notification.requestPermission().then(updateNotifBtn);
  }
  setInterval(tick, 1000);
}

// ---------- Firebase init, guarded so a bad config never breaks the
// rest of the page (in particular, never breaks the "Entrer" button). ----------
try {
  firebase.initializeApp(firebaseConfig);
  db = firebase.database();
  zonesRef = db.ref("zones");
  presenceRef = db.ref("presence");
  historyRef = db.ref("history");
  firebaseReady = true;
} catch (e) {
  console.error("Erreur d'initialisation Firebase :", e);
  showGateError("⚠️ Config Firebase invalide — vérifie firebaseConfig dans index.html.");
}


// Construit la structure à jour à partir de ZONES_CONFIG, en réutilisant les
// raids déjà en cours pour les lieux qui existaient déjà (retrouvés par leur
// nom), et en ajoutant simplement les nouveaux lieux/zones sans toucher au
// reste. Ça évite de tout réinitialiser à chaque évolution de la config.
function buildMergedZones(loaded) {
  // Firebase peut renvoyer "zones" soit comme un vrai tableau JS, soit comme
  // un objet à clés numériques ("0", "1", "2"...) selon l'historique des
  // écritures (ex: une écriture ciblée sur un nouvel index peut faire
  // basculer la représentation). Ne tester QUE Array.isArray faisait croire
  // à "aucune donnée" dans ce second cas, et effaçait tout. On gère les
  // deux formats explicitement.
  function getZoneAt(zi) {
    if (Array.isArray(loaded)) return loaded[zi];
    if (loaded && typeof loaded === "object") return loaded[String(zi)];
    return undefined;
  }
  function getSlotsArray(zoneData) {
    const s = zoneData && zoneData.slots;
    if (Array.isArray(s)) return s;
    if (s && typeof s === "object") return Object.keys(s).map((k) => s[k]);
    return [];
  }
  return ZONES_CONFIG.map((zc, zi) => {
    const existingZone = getZoneAt(zi);
    const existingSlotsByLoc = {};
    getSlotsArray(existingZone).forEach((sl) => {
      if (sl && sl.locationName) existingSlotsByLoc[sl.locationName] = sl;
    });
    return {
      id: `zone-${zi}`,
      label: (existingZone && existingZone.label) || zc.label,
      slots: zc.locations.map((loc, si) => {
        const existingSlot = existingSlotsByLoc[loc];
        return {
          id: `zone-${zi}-slot-${si}`,
          locationName: loc,
          raid: (existingSlot && existingSlot.raid) || null,
        };
      }),
    };
  });
}

function pad(n) { return String(n).padStart(2, "0"); }
function formatRemaining(ms) {
  const total = Math.max(0, Math.round(ms / 1000));
  const h = Math.floor(total / 3600), m = Math.floor((total % 3600) / 60), s = total % 60;
  return `${h}:${pad(m)}:${pad(s)}`;
}
function escapeHtml(str) {
  const d = document.createElement("div");
  d.textContent = str;
  return d.innerHTML;
}
function pokeballSvg(size) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="#F5F1E8" stroke="#14161A" stroke-width="2.5"/><path d="M2 20a18 18 0 0136 0" fill="#E6473F" stroke="#14161A" stroke-width="2.5"/><line x1="2" y1="20" x2="38" y2="20" stroke="#14161A" stroke-width="2.5"/><circle cx="20" cy="20" r="6" fill="#F5F1E8" stroke="#14161A" stroke-width="2.5"/><circle cx="20" cy="20" r="2.4" fill="#14161A"/></svg>`;
}
const SOUND_PRESETS = {
  classique: { label: "Classique", type: "square", notes: [880, 1108, 1318], noteLen: 0.22, gap: 0.14, gain: 0.18 },
  urgent: { label: "Alerte urgente", type: "sawtooth", notes: [1200, 900, 1200, 900, 1200], noteLen: 0.11, gap: 0.09, gain: 0.16 },
  douce: { label: "Cloche douce", type: "sine", notes: [523, 659, 784], noteLen: 0.35, gap: 0.22, gain: 0.14 },
  robot: { label: "Bip robot", type: "square", notes: [1000, 800, 600, 400], noteLen: 0.09, gap: 0.06, gain: 0.15 },
  fanfare: { label: "Fanfare", type: "triangle", notes: [659, 659, 659, 880, 1318], noteLen: 0.14, gap: 0.1, gain: 0.2 },
  sirene: { label: "Sirène", type: "sawtooth", notes: [1400, 700, 1400, 700, 1400, 700], noteLen: 0.15, gap: 0.12, gain: 0.17 },
  cloche_eglise: { label: "Cloche d'église", type: "sine", notes: [392, 494, 392, 587], noteLen: 0.5, gap: 0.35, gain: 0.16 },
  arcade: { label: "Arcade", type: "square", notes: [523, 587, 659, 698, 784, 880, 988, 1047], noteLen: 0.06, gap: 0.05, gain: 0.15 },
  spatial: { label: "Alerte spatiale", type: "sawtooth", notes: [1600, 1200, 900, 650, 450], noteLen: 0.12, gap: 0.09, gain: 0.14 },
  tambour: { label: "Tambour", type: "triangle", notes: [110, 110, 110, 110], noteLen: 0.08, gap: 0.18, gain: 0.28 },
};
const SOUND_PREF_KEY = "cobblemon-raid-sound";
function getSoundPref() {
  const v = localStorage.getItem(SOUND_PREF_KEY);
  return SOUND_PRESETS[v] ? v : "classique";
}
function setSoundPref(v) {
  if (SOUND_PRESETS[v]) localStorage.setItem(SOUND_PREF_KEY, v);
}
function playPreset(key) {
  const preset = SOUND_PRESETS[key] || SOUND_PRESETS.classique;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    preset.notes.forEach((freq, i) => {
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.type = preset.type; osc.frequency.value = freq;
      osc.connect(gain); gain.connect(ctx.destination);
      const noteStart = ctx.currentTime + i * preset.gap;
      gain.gain.setValueAtTime(0.0001, noteStart);
      gain.gain.exponentialRampToValueAtTime(preset.gain, noteStart + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, noteStart + preset.noteLen);

function playChime() {

}
function initSoundPanel() {
  const select = document.getElementById("soundSelect");
  select.innerHTML = "";
  Object.entries(SOUND_PRESETS).forEach(([key, p]) => {
    const opt = document.createElement("option");
    opt.value = key;
    opt.textContent = p.label;
    select.appendChild(opt);
  });
  select.value = getSoundPref();
  select.addEventListener("change", () => setSoundPref(select.value));

}

// ---------- Copier le résumé ----------
function buildSummaryText() {
  if (!zones) return "Aucun raid en cours.";
  const now = Date.now();
  const lines = ["🔔 Raids en cours — Raid Tracker"];
  let any = false;
  zones.forEach((z) => {
    z.slots.forEach((sl) => {
      if (!sl.raid) return;
      const remaining = sl.raid.endTime - now;
      if (remaining <= 0) return;
      any = true;
      lines.push(`• ${z.label} - ${sl.locationName} : ${sl.raid.name} (${formatRemaining(remaining)} restant)`);
    });
  });
  if (!any) return "Aucun raid en cours pour le moment.";
  return lines.join("\n");
}
function initCopySummary() {
  const btn = document.getElementById("copySummaryBtn");
  btn.addEventListener("click", async () => {
    const text = buildSummaryText();
    try {
      await navigator.clipboard.writeText(text);
      const original = btn.textContent;
      btn.textContent = "✅ Copié !";
      setTimeout(() => { btn.textContent = original; }, 1800);
    } catch (e) {
      window.prompt("Copie manuelle (Ctrl+C) :", text);
    }
  });
}

function initHistoryPanel() {
  const btn = document.getElementById("historyBtn");
  const panel = document.getElementById("historyPanel");
  btn.addEventListener("click", () => {
    const willOpen = panel.style.display === "none";
    panel.style.display = willOpen ? "block" : "none";
    if (willOpen) loadHistory();

}

// ---------- Mode admin (protection locale, dans le même esprit que la
// restriction d'édition : une politesse d'interface, pas une sécurité
// serveur) ----------
function updateAdminBtn() {
  const btn = document.getElementById("adminBtn");
  btn.textContent = adminMode ? "🔓 Quitter le mode admin" : "🔑 Mode admin";
  btn.classList.toggle("admin-active", adminMode);
}
function initAdminMode() {
  updateAdminBtn();
  document.getElementById("adminBtn").addEventListener("click", () => {
    if (adminMode) {
      adminMode = false;
      localStorage.removeItem(ADMIN_STORAGE_KEY);
      updateAdminBtn();
      renderAll();
      return;
    }
    const attempt = window.prompt("Mot de passe admin :");
    if (attempt === null) return;
    if (attempt === ADMIN_PASSWORD) {
      adminMode = true;
      localStorage.setItem(ADMIN_STORAGE_KEY, "1");
      updateAdminBtn();
      renderAll();
    } else {
      window.alert("Mot de passe incorrect.");
    }
  });
}
function loadHistory() {
  if (!historyRef) return;
  const listEl = document.getElementById("historyList");
  listEl.innerHTML = `<div class="history-empty">Chargement…</div>`;
  historyRef.orderByChild("at").limitToLast(40).once("value", (snap) => {
    const entries = [];
    snap.forEach((child) => { entries.push(child.val()); });
    entries.reverse();
    if (entries.length === 0) {
      listEl.innerHTML = `<div class="history-empty">Aucun historique pour le moment.</div>`;
      return;
    }
    listEl.innerHTML = entries
      .map((h) => {
        const date = h.at ? new Date(h.at) : null;
        const timeStr = date ? date.toLocaleString("fr-FR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) : "";
        return `<div class="history-item">${escapeHtml(h.name || "?")} — <span class="history-meta">${escapeHtml(h.zoneLabel || "")} / ${escapeHtml(h.locationName || "")} · par ${escapeHtml(h.pseudo || "anonyme")} · ${timeStr}</span></div>`;
      })
      .join("");
  });
}
function notifySystem(title, body) {
  if (typeof Notification !== "undefined" && Notification.permission === "granted") {
    try { new Notification(title, { body }); } catch (e) {}
  }
}
function updateNotifBtn() {
  const btn = document.getElementById("notifBtn");
  if (typeof Notification === "undefined") { btn.style.display = "none"; return; }
  btn.style.display = Notification.permission === "granted" ? "none" : "block";
}
document.getElementById("notifBtn").addEventListener("click", async () => {
  if (typeof Notification === "undefined") return;
  await Notification.requestPermission();
  updateNotifBtn();
});

// ---------- Pokémon lookup (French names): dataset local embarqué,
// aucune API externe requise → plus de panne possible côté tiers.
// Sprite servi depuis raw.githubusercontent.com (CDN statique très stable).
function normalizeAccents(str) {
  return str
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[’‘]/g, "'")
    .toLowerCase().trim();
}
const POKEDEX_FR_NORMALIZED = {};
Object.keys(POKEDEX_FR).forEach((k) => {
  POKEDEX_FR_NORMALIZED[normalizeAccents(k)] = POKEDEX_FR[k];
});
// Liste triée des noms canoniques, pour l'autocomplétion
const POKEDEX_NAMES_LIST = Object.values(POKEDEX_FR)
  .map((e) => e.n)
  .sort((a, b) => a.localeCompare(b, "fr"));

// Peuple la <datalist> native une seule fois : autocomplétion 100% gérée
// par le navigateur, aucun risque de conflit avec la saisie de l'utilisateur.
(function populateDatalist() {
  const dl = document.getElementById("pokemonNamesList");
  if (!dl) return;
  const frag = document.createDocumentFragment();
  POKEDEX_NAMES_LIST.forEach((n) => {
    const opt = document.createElement("option");
    opt.value = n;
    frag.appendChild(opt);
  });
  dl.appendChild(frag);
})();

function fetchPokemonData(name) {
  const key = name.trim().toLowerCase();
  if (!key) return { sprite: null, types: [] };
  let entry = POKEDEX_FR[key] || POKEDEX_FR_NORMALIZED[normalizeAccents(key)];
  if (!entry) return { sprite: null, types: [] };
  return {
    sprite: `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${entry.id}.png`,
    types: entry.types || [],
  };
}

function sanitizeKey(str) {
  return (str || "anon").toString().replace(/[.#$\[\]\/]/g, "_").slice(0, 60) || "anon";

// ---------- Firebase read/write ----------
// Chaque action écrit UNIQUEMENT les chemins précis concernés (via
// update() multi-chemins), jamais le tableau entier des zones. Comme ça,
// même si plusieurs personnes agissent en même temps sur des emplacements
// différents, une écriture ne peut plus jamais effacer celle d'un autre.
// L'affichage local, lui, reste optimiste (mis à jour immédiatement, sans
// attendre la confirmation réseau).
function reportWriteError(err) {
  console.error("Erreur d'écriture Firebase:", err);
  const el = document.getElementById("connStatus");
  if (el) {
    el.style.display = "block";
    el.textContent = "⚠️ L'enregistrement a échoué (connexion instable ?). Réessaie.";
  }
}

function applyLocally(mutatorFn) {
  const merged = buildMergedZones(zones);
  mutatorFn(merged);
  zones = merged;
  if (!openForm) renderAll();
  return merged;
}

function writeSlot(zi, si, raidValue) {
  // Écriture ciblée SUR CE SEUL raid (pas toute la zone), pour que les
  // règles de sécurité Firebase puissent vérifier l'auteur exact du raid
  // modifié, sans jamais avoir besoin de valider (et donc risquer de
  // bloquer) les raids des autres joueurs dans la même zone.
  const zc = ZONES_CONFIG[zi];
  const zoneLabel = (zones[zi] && zones[zi].label) || zc.label;
  zonesRef.update({
    [`${zi}/id`]: `zone-${zi}`,
    [`${zi}/label`]: zoneLabel,
    [`${zi}/slots/${si}/id`]: `zone-${zi}-slot-${si}`,
    [`${zi}/slots/${si}/locationName`]: zc.locations[si],
    [`${zi}/slots/${si}/raid`]: raidValue,
  }).catch(reportWriteError);
}

  const key = sanitizeKey(pseudo);
  let updatedRaid = null;
  applyLocally((current) => {
    const raid = current[zi].slots[si].raid;
    if (!raid) return;
    if (!raid.reactions) raid.reactions = {};
    if (!raid.reactions[emojiKey(emoji)]) raid.reactions[emojiKey(emoji)] = {};
    if (raid.reactions[emojiKey(emoji)][key]) {
      delete raid.reactions[emojiKey(emoji)][key];
    } else {
      raid.reactions[emojiKey(emoji)][key] = true;
    }
    updatedRaid = raid;
  });
  if (updatedRaid) writeSlot(zi, si, updatedRaid);
}

function addRaid(zoneIdx, slotIdx, name, totalSeconds, sprite, types) {
  const endTime = Date.now() + totalSeconds * 1000;
  const raid = { name, totalSeconds, endTime, sprite: sprite || null, types: types || [], addedBy: pseudo || null };
  openForm = null;
  applyLocally((current) => {
    current[zoneIdx].slots[slotIdx].raid = raid;
  });
  writeSlot(zoneIdx, slotIdx, raid);
  logHistory(zoneIdx, slotIdx, name);
}
function editRaid(zoneIdx, slotIdx, name, totalSeconds, sprite, types) {
  openForm = null;
  let updatedRaid = null;
  applyLocally((current) => {
    const existing = current[zoneIdx].slots[slotIdx].raid || {};
    const endTime = Date.now() + totalSeconds * 1000;
    updatedRaid = { ...existing, name, totalSeconds, endTime, sprite: sprite || null, types: types || existing.types || [] };
    current[zoneIdx].slots[slotIdx].raid = updatedRaid;
  });
  writeSlot(zoneIdx, slotIdx, updatedRaid);
}
function logHistory(zoneIdx, slotIdx, name) {
  if (!historyRef) return;
  const zone = zones && zones[zoneIdx];
  const slot = zone && zone.slots[slotIdx];
  historyRef.push({
    name,
    zoneLabel: (zone && zone.label) || "",
    locationName: (slot && slot.locationName) || "",
    pseudo: pseudo || "anonyme",
    at: firebase.database.ServerValue.TIMESTAMP,
  });
}
function removeRaid(zoneIdx, slotIdx, slotId) {
  notifiedIds.delete(slotId);
  applyLocally((current) => {
    current[zoneIdx].slots[slotIdx].raid = null;
  });
  writeSlot(zoneIdx, slotIdx, null);
}
let renameZoneDebounce = null;
function renameZone(zoneIdx, label) {
  applyLocally((current) => {
    current[zoneIdx].label = label;
  });
  clearTimeout(renameZoneDebounce);
  renameZoneDebounce = setTimeout(() => {
    zonesRef.update({
      [`${zoneIdx}/id`]: `zone-${zoneIdx}`,
      [`${zoneIdx}/label`]: label,
    }).catch(reportWriteError);
  }, 400);
}

// ---------- Firebase realtime listeners (only if init succeeded) ----------
if (firebaseReady) {
  // --- Initialisation robuste des zones Firebase ---
async function ensureFirebaseZones() {
  try {
    const snapshot = await zonesRef.once("value");
    const current = snapshot.val() || {};
    const updates = {};

    ZONES_CONFIG.forEach((zc, zi) => {
      const existingZone = current[zi] || {};
      if (!existingZone.id) updates[`${zi}/id`] = `zone-${zi}`;
      if (!existingZone.label) updates[`${zi}/label`] = zc.label;

      zc.locations.forEach((locationName, si) => {
        const existingSlot = existingZone.slots && existingZone.slots[si];
        if (!existingSlot || !existingSlot.id)
          updates[`${zi}/slots/${si}/id`] = `zone-${zi}-slot-${si}`;
        if (!existingSlot || !existingSlot.locationName)
          updates[`${zi}/slots/${si}/locationName`] = locationName;
      });
    });

    if (Object.keys(updates).length > 0) {
      await zonesRef.update(updates);
      console.log("[Firebase] Zones manquantes initialisées", updates);
    }
  } catch (error) {
    console.error("[Firebase] Impossible d'initialiser les zones", error);
  }
}

zonesRef.on("value", (snapshot) => {
    const val = snapshot.val();
    // La fusion avec ZONES_CONFIG reste purement locale à l'affichage :
    // chaque client la recalcule à partir des mêmes données brutes, sans
    // jamais réécrire la base. Ça évite tout risque qu'une réécriture
    // entre en collision avec un raid tout juste ajouté par quelqu'un.
    zones = buildMergedZones(val);
    // Tant qu'un formulaire (ajout/édition) est ouvert, on met à jour les
    // données en arrière-plan mais on ne touche PAS à l'écran : ça protège
    // totalement la saisie en cours, quelle que soit la fréquence des
    // mises à jour reçues (réactions d'un ami, reconnexions réseau, etc.).
    if (!openForm) {
      renderAll();
    }
    updateConnStatus(true);

  if (!window.__firebaseZonesInitialized) {
    window.__firebaseZonesInitialized = true;
    ensureFirebaseZones();
  }  }, (err) => {
    updateConnStatus(false, err);
  });
}

function updateConnStatus(ok, err) {
  const el = document.getElementById("connStatus");
  if (ok) { el.style.display = "none"; return; }
  el.style.display = "block";
  el.textContent = "⚠️ Connexion à la base de données impossible — vérifie ta config Firebase dans index.html.";
}

// ---------- Presence: who's currently online ----------
function setupPresence() {
  const myRef = presenceRef.child(sessionId);
  db.ref(".info/connected").on("value", (snap) => {
    if (snap.val() === true) {
      myRef.onDisconnect().remove();
      myRef.set({ pseudo: pseudo || "anonyme", at: firebase.database.ServerValue.TIMESTAMP });
    }
  });
  presenceRef.on("value", (snapshot) => {
    const val = snapshot.val() || {};
    renderPresence(Object.values(val));
  });
  window.addEventListener("beforeunload", () => { myRef.remove(); });
}

function renderPresence(list) {
  list.sort((a, b) => (a.at || 0) - (b.at || 0));
  document.getElementById("presenceCount").textContent = list.length;
  const el = document.getElementById("presenceList");
  if (list.length === 0) {
    el.innerHTML = `<div class="presence-empty">Personne pour le moment</div>`;
    return;
  }
  el.innerHTML = list
    .map((p) => `<div class="presence-item"><span class="presence-dot"></span><span class="presence-name">${escapeHtml(p.pseudo || "anonyme")}</span></div>`)
    .join("");
}

// ---------- Rendering ----------
function safeSelectionStart(el) {
  try { return el.selectionStart; } catch (e) { return null; }
}
function captureActiveInputState() {
  try {
    const el = document.activeElement;
    if (!el || el.tagName !== "INPUT") return null;
    if (el.classList.contains("zone-label")) {
      return { kind: "zone-label", zoneId: el.dataset.zoneId, value: el.value, selectionStart: safeSelectionStart(el) };
    }
    if (el.closest(".slot-form")) {
      const form = el.closest(".slot-form");
      return {
        kind: "raid-form",
        field: el.classList.contains("raid-name") ? "raid-name" : el.classList.contains("raid-h") ? "raid-h" : el.classList.contains("raid-m") ? "raid-m" : "raid-s",
        name: form.querySelector(".raid-name")?.value ?? "",
        h: form.querySelector(".raid-h")?.value ?? "",
        m: form.querySelector(".raid-m")?.value ?? "",
        s: form.querySelector(".raid-s")?.value ?? "",
        selectionStart: safeSelectionStart(el),
      };
    }
    return null;
  } catch (e) {
    console.error("captureActiveInputState error:", e);
    return null;
  }
}
function restoreActiveInputState(state) {
  try {
    if (!state) return;
    if (state.kind === "zone-label") {
      const el = document.querySelector(`.zone-label[data-zone-id="${state.zoneId}"]`);
      if (el) {
        el.value = state.value;
        el.focus();
        if (state.selectionStart != null) {
          try { el.setSelectionRange(state.selectionStart, state.selectionStart); } catch (e) {}
        }
      }
      return;
    }
    if (state.kind === "raid-form") {
      const form = document.querySelector(".slot-form");
      if (!form) return;
      const nameEl = form.querySelector(".raid-name");
      const hEl = form.querySelector(".raid-h");
      const mEl = form.querySelector(".raid-m");
      const sEl = form.querySelector(".raid-s");
      if (nameEl) nameEl.value = state.name;
      if (hEl) hEl.value = state.h;
      if (mEl) mEl.value = state.m;
      if (sEl) sEl.value = state.s;
      const focusEl = form.querySelector(`.${state.field}`);
      if (focusEl) {
        focusEl.focus();
        if (state.selectionStart != null) {
          try { focusEl.setSelectionRange(state.selectionStart, state.selectionStart); } catch (e) {}
        }
      }
    }
  } catch (e) {
    console.error("restoreActiveInputState error:", e);
  }
}

function renderAll() {
  if (!zones) return;
  const pendingInput = captureActiveInputState();
  const zonesEl = document.getElementById("zones");
  const previousHTML = zonesEl.innerHTML;
  try {
    renderBanner();
    zonesEl.innerHTML = "";
    zones.forEach((zone, zi) => {
      const zEl = document.createElement("div");
      zEl.className = "zone";
      const label = document.createElement("input");
      label.className = "zone-label pixel";
      label.value = zone.label;
      label.dataset.zoneId = zone.id;
      label.oninput = (e) => renameZone(zi, e.target.value);
      zEl.appendChild(label);

      const grid = document.createElement("div");
      grid.className = "grid";
      zone.slots.forEach((slot, si) => grid.appendChild(renderSlot(zone, zi, slot, si)));
      zEl.appendChild(grid);
      zonesEl.appendChild(zEl);
    });
    restoreActiveInputState(pendingInput);
  } catch (e) {
    console.error("renderAll error, restauration de l'affichage précédent:", e);
    zonesEl.innerHTML = previousHTML;
  }
}

function renderBanner() {
  const now = Date.now();
  const finished = [];
  zones.forEach((z, zi) => z.slots.forEach((sl, si) => { if (sl.raid && sl.raid.endTime <= now) finished.push({ z, zi, sl, si }); }));
  const banner = document.getElementById("banner");
  const bannerRows = document.getElementById("bannerRows");
  if (finished.length > 0) {
    banner.classList.add("show");
    bannerRows.innerHTML = "";
    finished.forEach(({ z, zi, sl, si }) => {
      const row = document.createElement("div");
      row.className = "banner-row";
      row.innerHTML = `<span>${escapeHtml(sl.raid.name)} <span style="color:#8b8f99">· ${escapeHtml(z.label)}</span></span>`;
      const btn = document.createElement("button");
      btn.textContent = "OK, fermer";
      btn.onclick = () => removeRaid(zi, si, sl.id);
      row.appendChild(btn);
      bannerRows.appendChild(row);
    });
  } else {
    banner.classList.remove("show");
  }
}

function buildRaidFormEl({ initialName = "", initialH = "", initialM = "", initialS = "", initialSprite = null, initialTypes = [], onSubmit, onCancel }) {
  const el = document.createElement("div");
  el.className = "slot-form";
  el.innerHTML = `
    <div class="name-row">
      <div class="sprite-preview">${initialSprite ? `<img src="${initialSprite}" alt="" />` : pokeballSvg(18)}</div>
      <input type="text" class="raid-name" placeholder="Pokémon (en français)" autocomplete="off" list="pokemonNamesList" />
    </div>
    <div class="time-row">
      <input type="number" min="0" class="raid-h" placeholder="h" />
      <input type="number" min="0" max="59" class="raid-m" placeholder="min" />
      <input type="number" min="0" max="59" class="raid-s" placeholder="sec" />
    </div>
    <p class="error" style="display:none;"></p>
    <div class="form-actions">
      <button class="btn-primary">Lancer</button>
      <button class="btn-secondary">Annuler</button>
    </div>`;
  const nameInput = el.querySelector(".raid-name");
  const hInput = el.querySelector(".raid-h");
  const mInput = el.querySelector(".raid-m");
  const sInput = el.querySelector(".raid-s");
  const errorP = el.querySelector(".error");
  const preview = el.querySelector(".sprite-preview");
  nameInput.value = initialName;
  hInput.value = initialH;
  mInput.value = initialM;
  sInput.value = initialS;
  let currentSprite = initialSprite;
  let currentTypes = initialTypes;
  let debounceHandle = null;

  function applyPokemonData(typedName) {
    const data = fetchPokemonData(typedName);
    currentSprite = data.sprite;
    currentTypes = data.types;
    preview.innerHTML = data.sprite ? `<img src="${data.sprite}" alt="" />` : pokeballSvg(18);
  }

  nameInput.addEventListener("input", () => {
    currentSprite = null;
    currentTypes = [];
    preview.innerHTML = pokeballSvg(18);
    clearTimeout(debounceHandle);
    const typed = nameInput.value;
    if (!typed.trim()) return;
    debounceHandle = setTimeout(() => {
      if (nameInput.value === typed) applyPokemonData(typed);
    }, 150);
  });

  const submit = () => {
    const hh = parseInt(hInput.value, 10) || 0;
    const mm = parseInt(mInput.value, 10) || 0;
    const ss = parseInt(sInput.value, 10) || 0;
    const total = hh * 3600 + mm * 60 + ss;
    if (!nameInput.value.trim()) { errorP.textContent = "Nom du Pokémon manquant."; errorP.style.display = "block"; return; }
    if (total <= 0) { errorP.textContent = "Durée invalide."; errorP.style.display = "block"; return; }
    onSubmit(nameInput.value.trim(), total, currentSprite, currentTypes);
  };
  el.querySelector(".btn-primary").onclick = submit;
  el.querySelector(".btn-secondary").onclick = onCancel;
  [nameInput, hInput, mInput, sInput].forEach(inp => {
    inp.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); submit(); } });
  });
  return el;
}

function canEdit(raid) {
  if (isAdmin()) return true;
  if (!raid.addedBy) return true; // posté anonymement : modifiable par tous
  return raid.addedBy.trim().toLowerCase() === pseudo.trim().toLowerCase();
}

function canRemove(raid, done) {
  if (isAdmin()) return true;
  if (done) return true; // un raid terminé peut être fermé par tout le monde
  return canEdit(raid);
}

function renderSlot(zone, zi, slot, si) {
  const raid = slot.raid;
  const isOpenAdd = openForm && openForm.mode === "add" && openForm.zi === zi && openForm.si === si;
  const isOpenEdit = openForm && openForm.mode === "edit" && openForm.zi === zi && openForm.si === si;
  const locLabel = `<div class="loc-label">📍 ${escapeHtml(slot.locationName || "")}</div>`;

  if (!raid || isOpenEdit) {
    const wrap = document.createElement("div");
    wrap.className = "slot-wrap";
    wrap.innerHTML = locLabel;

    const el = document.createElement("div");
    el.className = "slot-empty" + (isOpenAdd || isOpenEdit ? " open" : "");

    if (isOpenEdit && raid) {
      const now = Date.now();
      const remainingMs = Math.max(0, raid.endTime - now);
      const totalS = Math.round(remainingMs / 1000);
      const h = Math.floor(totalS / 3600);
      const m = Math.floor((totalS % 3600) / 60);
      const s = totalS % 60;
      const form = buildRaidFormEl({
        initialName: raid.name,
        initialH: h || "",
        initialM: m || "",
        initialS: s || "",
        initialSprite: raid.sprite,
        initialTypes: raid.types || [],
        onSubmit: (name, total, sprite, types) => editRaid(zi, si, name, total, sprite, types),
        onCancel: () => { openForm = null; renderAll(); },
      });
      el.appendChild(form);
    } else if (isOpenAdd) {
      const form = buildRaidFormEl({
        onSubmit: (name, total, sprite, types) => addRaid(zi, si, name, total, sprite, types),
        onCancel: () => { openForm = null; renderAll(); },
      });
      el.appendChild(form);
    } else {
      const btn = document.createElement("button");
      btn.className = "add-btn";
      btn.textContent = "+ Raid";
      btn.onclick = () => {
        openForm = { zi, si, mode: "add" };
        renderAll();
        document.querySelector(".slot-form .raid-name")?.focus();
      };
      el.appendChild(btn);
    }
    wrap.appendChild(el);
    return wrap;
  }

  const now = Date.now();
  const remaining = raid.endTime - now;
  const fraction = Math.max(0, Math.min(1, remaining / (raid.totalSeconds * 1000)));
  const done = remaining <= 0;
  const urgent = !done && fraction < 0.1;
  const editable = canEdit(raid);
  const removable = canRemove(raid, done);

  const wrap = document.createElement("div");
  wrap.className = "slot-wrap";
  wrap.innerHTML = locLabel;

  const el = document.createElement("div");
  el.id = `slot-card-${slot.id}`;
  el.className = "slot-card" + (done ? " done" : urgent ? " urgent" : "");
  const typeBadges = (raid.types || [])
    .map((t) => `<span class="type-badge" style="background:${TYPE_COLORS[t] || "#555"}">${escapeHtml(t)}</span>`)
    .join("");
  el.innerHTML = `
    <div class="slot-top">
      <div class="slot-icon">${raid.sprite ? `<img src="${raid.sprite}" alt="" />` : pokeballSvg(14)}</div>
      <span class="slot-name">${escapeHtml(raid.name)}</span>
      ${editable ? `<button class="edit-btn" title="Modifier">✎</button>` : ""}
      ${removable ? `<button class="remove-btn" title="Supprimer">×</button>` : ""}
    </div>
    ${typeBadges ? `<div class="type-row">${typeBadges}</div>` : ""}
    <div id="time-box-${slot.id}" class="time-box pixel ${done ? "done" : urgent ? "urgent" : ""}">${done ? "TERMINÉ" : formatRemaining(remaining)}</div>
    ${raid.addedBy ? `<span class="added-by">ajouté par ${escapeHtml(raid.addedBy)}</span>` : ""}
    <div class="reaction-row">
      ${REACTION_EMOJIS.map((em) => {
        const users = (raid.reactions && raid.reactions[emojiKey(em)]) || {};
        const count = Object.keys(users).length;
        const mine = !!users[sanitizeKey(pseudo)];
        return `<button class="reaction-btn${mine ? " active" : ""}" data-emoji="${em}">${em}${count ? ` ${count}` : ""}</button>`;
      }).join("")}
    </div>
  `;
  if (editable) {
    el.querySelector(".edit-btn").onclick = () => {
      openForm = { zi, si, mode: "edit" };
      renderAll();
      document.querySelector(".slot-form .raid-name")?.focus();
    };
  }
  if (removable) {
    el.querySelector(".remove-btn").onclick = () => removeRaid(zi, si, slot.id);
  }
  el.querySelectorAll(".reaction-btn").forEach((btn) => {
    btn.onclick = () => toggleReaction(zi, si, btn.dataset.emoji);
  });
  wrap.appendChild(el);
  return wrap;
}

// ---------- Per-second timer update (never touches open forms) ----------
function tick() {
  if (!zones) return;
  const now = Date.now();
  let hasUndismissed = false;
  let bannerNeedsRefresh = false;

  zones.forEach((z) => z.slots.forEach((sl) => {
    if (!sl.raid) return;
    const remaining = sl.raid.endTime - now;
    const fraction = Math.max(0, Math.min(1, remaining / (sl.raid.totalSeconds * 1000)));
    const done = remaining <= 0;
    const urgent = !done && fraction < 0.1;

    const card = document.getElementById(`slot-card-${sl.id}`);
    const timeBox = document.getElementById(`time-box-${sl.id}`);
    if (card && timeBox) {
      timeBox.textContent = done ? "TERMINÉ" : formatRemaining(remaining);
      timeBox.className = "time-box pixel" + (done ? " done" : urgent ? " urgent" : "");
      card.className = "slot-card" + (done ? " done" : urgent ? " urgent" : "");
    }
    if (done) {
      hasUndismissed = true;
      if (!notifiedIds.has(sl.id)) {
        notifiedIds.add(sl.id);
        playChime();
        notifySystem("Raid terminé !", `${sl.raid.name} vient de se terminer.`);
        bannerNeedsRefresh = true;
      }
    }
  }));

  if (bannerNeedsRefresh) renderBanner();
  if (hasUndismissed && !repeatTimer) repeatTimer = setInterval(() => playChime(), 4000);
  else if (!hasUndismissed && repeatTimer) { clearInterval(repeatTimer); repeatTimer = null; }
}
</script>
